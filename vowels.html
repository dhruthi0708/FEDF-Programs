<!DOCTYPE html>
<html>
<head>
    <title>Vowel Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fb;
            text-align: center;
            padding: 50px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }

        h2 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-top: 15px;
            font-size: 16px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4da6ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3399ff;
        }

        p {
            margin-top: 20px;
            font-size: 18px;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Vowel Counter</h2>
        <input type="text" id="textInput" placeholder="Enter a string">
        <br>
        <button onclick="countVowels()">Count Vowels</button>
        <p id="result"></p>
    </div>

    <script>
        function countVowels() {
            let str = document.getElementById("textInput").value;
            let count = 0;
            let vowels = "aeiouAEIOU";

            for (let i = 0; i < str.length; i++) {
                if (vowels.includes(str[i])) {
                    count++;
                }
            }

            document.getElementById("result").innerHTML =
                "Number of vowels: " + count;
        }
    </script>

</body>
</html>
